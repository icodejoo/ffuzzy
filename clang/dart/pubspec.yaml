name: ffz
description: >-
  Dart/Flutter FFI binding for the ffz C fuzzy matcher (nucleo-compatible):
  fuzzy/substring/prefix/postfix/exact matching with a resident multi-key
  corpus, optional multi-threading, and Unicode (CJK) support.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

# To ship the native library with a Flutter app, turn this into an FFI plugin:
# add a `flutter:` section with `plugin: platforms: { windows/linux/android/...:
# { ffiPlugin: true } }` and point each platform's build at ../CMakeLists.txt
# (Android uses CMake too; iOS/macOS static-link via a podspec). See README.md.
