[package]
name = "rust_lib_ffuzzy"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
nucleo-matcher = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# 体积优化:打进 App 的原生库越小越好。
[profile.release]
opt-level = "z"      # 优先体积
lto = true           # 链接时优化,去无用代码
codegen-units = 1    # 更充分的跨单元优化(更小)
strip = true         # 去符号表
# panic = "abort"      # size-profile:panic  去掉栈展开表(safe 档由脚本注释此行)
# 代价:Rust panic 直接 abort 进程,不再被 frb 捕获转成 Dart 异常。
# 纯计算的模糊匹配正常输入不会 panic,只有内部 bug 才会。
# CI 预编译进一步叠加 nightly build-std(见 cargokit.yaml)+ RUSTFLAGS
# immediate-abort(见 .github/workflows),把 std/panic 机制压到最小(实测再省约 ⅓)。
