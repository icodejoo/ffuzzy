name: Precompile Binaries

# 手动触发:在 GitHub 仓库 Actions 页面点 "Run workflow"。
# 每次改动 rust/ 源码或依赖后都要重跑一次(crate-hash 会变),再发布到 pub.dev。
on:
  workflow_dispatch:

permissions:
  contents: write   # 需要创建 Release、上传二进制资产

jobs:
  precompile:
    name: ${{ matrix.os }} (${{ matrix.kind }})
    strategy:
      fail-fast: false
      max-parallel: 1   # 串行,避免多台 runner 同时创建同一个 Release 冲突
      matrix:
        include:
          - os: ubuntu-latest    # linux-x64(原生)+ Android 四架构(NDK 交叉)
            kind: android
          - os: ubuntu-latest    # linux arm64(zig 交叉,钉死低 glibc)
            kind: cross-linux
          - os: macos-latest     # macOS(x64/arm64) + iOS(真机/模拟器)
            kind: desktop
          - os: windows-latest   # windows x64 + arm64
            kind: desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (provides Dart)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 自动探测体积档位:cargokit.yaml 里有生效(未注释)的 build-std 才算「极致压缩档」。
      # 由 scripts/size-profile.sh 切换;此处据此决定 desktop/android 是否加 immediate-abort。
      - name: Detect size profile
        id: sp
        shell: bash
        run: |
          if grep -qE '^[[:space:]]+- "-Zbuild-std' rust/cargokit.yaml; then
            echo "extreme=1" >> "$GITHUB_OUTPUT"; echo "极致压缩档"
          else
            echo "extreme=0" >> "$GITHUB_OUTPUT"; echo "稳妥档"
          fi

      # cargo-zigbuild 由 cargokit 自动 `cargo install`,但 zig 本身要单独装。
      - name: Setup Zig (for cross-linux)
        if: ${{ matrix.kind == 'cross-linux' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install build_tool dependencies
        working-directory: cargokit/build_tool
        run: dart pub get

      - name: Precompile (desktop + iOS)
        if: ${{ matrix.kind == 'desktop' }}
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 极致压缩档才加 immediate-abort;只作用于带 --target 的产物,不污染 host proc-macro。
          RUSTFLAGS: ${{ steps.sp.outputs.extreme == '1' && '-Zunstable-options -Cpanic=immediate-abort' || '' }}
        run: >
          dart run build_tool precompile-binaries -v
          --manifest-dir=../../rust
          --repository=icodejoo/ffuzzy

      - name: Precompile (linux-x64 + Android)
        if: ${{ matrix.kind == 'android' }}
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 极致压缩档才加 immediate-abort;android 不走 zigbuild,无 host cargo install 被污染之虞。
          RUSTFLAGS: ${{ steps.sp.outputs.extreme == '1' && '-Zunstable-options -Cpanic=immediate-abort' || '' }}
        run: >
          dart run build_tool precompile-binaries -v
          --manifest-dir=../../rust
          --repository=icodejoo/ffuzzy
          --android-sdk-location=$ANDROID_SDK_ROOT
          --android-ndk-version=28.2.13676358
          --android-min-sdk-version=21

      # 用 cargo-zigbuild 在 x86_64 上交叉编译 ARM64 Linux,
      # --glibc-version=2.17 钉死 glibc 下限(manylinux2014 基线),最大化可移植性。
      # 此 job 不设 RUSTFLAGS immediate-abort:cargokit 会 `cargo install cargo-zigbuild`(host 编译),
      # immediate-abort 无 build-std 会让该 install 编不过。故 arm64 仅用 build-std(体积略大于其他平台,可接受)。
      - name: Precompile (linux arm64, cross)
        if: ${{ matrix.kind == 'cross-linux' }}
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dart run build_tool precompile-binaries -v
          --manifest-dir=../../rust
          --repository=icodejoo/ffuzzy
          --target=aarch64-unknown-linux-gnu
          --glibc-version=2.17
