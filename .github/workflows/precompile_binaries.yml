name: Precompile Binaries

# 手动触发:Actions 页点 "Run workflow",可选体积档位 + 是否同时编 lite。
# 注意:改 rust/ 源码或切换体积档位都会改变 crate-hash,需重跑本工作流并发新版本。
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "体积档位(extreme=极致压缩 / safe=原始~600KB / keep=用仓库当前配置)"
        type: choice
        default: keep
        options:
          - keep
          - extreme
          - safe
      build_lite:
        description: "同时编译 lite 变体(--no-default-features, ~254KB)"
        type: boolean
        default: true

permissions:
  contents: write   # 创建 Release、上传资产;prepare 还要把档位改动提交回仓库

jobs:
  # 先按所选档位改好配置并提交回仓库(让发布源码与即将编译的二进制 hash 一致),
  # 再把那个 commit 的 SHA 传给编译阶段,保证四个 runner 编的是同一份源码。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.out.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply size profile (${{ inputs.profile }})
        if: ${{ inputs.profile != 'keep' }}
        run: |
          bash scripts/size-profile.sh "${{ inputs.profile }}"
          if git diff --quiet; then
            echo "配置已是 ${{ inputs.profile }} 档,无需提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "ci: switch native-lib size profile to ${{ inputs.profile }}"
            git push
          fi

      - id: out
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  precompile:
    needs: prepare
    name: ${{ matrix.os }} (${{ matrix.kind }})
    strategy:
      fail-fast: false
      max-parallel: 1   # 串行,避免多台 runner 同时创建同一个 Release 冲突
      matrix:
        include:
          - os: ubuntu-latest    # linux-x64(原生)+ Android 四架构(NDK 交叉)
            kind: android
          - os: ubuntu-latest    # linux arm64(zig 交叉,钉死低 glibc)
            kind: cross-linux
          - os: macos-latest     # macOS(x64/arm64) + iOS(真机/模拟器)
            kind: desktop
          - os: windows-latest   # windows x64 + arm64
            kind: desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}   # 编译 prepare 提交后的源码

      - name: Setup Flutter (provides Dart)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 自动探测体积档位:cargokit.yaml 里有生效(未注释)的 build-std 才算「极致压缩档」。
      # 单一事实来源 = 仓库里的 cargokit.yaml;据此决定 desktop/android 是否加 immediate-abort。
      - name: Detect size profile
        id: sp
        shell: bash
        run: |
          if grep -qE '^[[:space:]]+- "-Zbuild-std' rust/cargokit.yaml; then
            echo "extreme=1" >> "$GITHUB_OUTPUT"; echo "极致压缩档"
          else
            echo "extreme=0" >> "$GITHUB_OUTPUT"; echo "稳妥档"
          fi

      # cargo-zigbuild 由 cargokit 自动 `cargo install`,但 zig 本身要单独装。
      - name: Setup Zig (for cross-linux)
        if: ${{ matrix.kind == 'cross-linux' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install build_tool dependencies
        working-directory: cargokit/build_tool
        run: dart pub get

      # ─── Full variant ─────────────────────────────────────────────────────

      - name: Precompile full (desktop + iOS)
        if: ${{ matrix.kind == 'desktop' }}
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTFLAGS: ${{ steps.sp.outputs.extreme == '1' && '-Zunstable-options -Cpanic=immediate-abort' || '' }}
        run: >
          dart run build_tool precompile-binaries -v
          --manifest-dir=../../rust
          --repository=icodejoo/ffuzzy

      - name: Precompile full (linux-x64 + Android)
        if: ${{ matrix.kind == 'android' }}
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTFLAGS: ${{ steps.sp.outputs.extreme == '1' && '-Zunstable-options -Cpanic=immediate-abort' || '' }}
        run: >
          dart run build_tool precompile-binaries -v
          --manifest-dir=../../rust
          --repository=icodejoo/ffuzzy
          --android-sdk-location=$ANDROID_SDK_ROOT
          --android-ndk-version=28.2.13676358
          --android-min-sdk-version=21

      - name: Precompile full (linux arm64, cross)
        if: ${{ matrix.kind == 'cross-linux' }}
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dart run build_tool precompile-binaries -v
          --manifest-dir=../../rust
          --repository=icodejoo/ffuzzy
          --target=aarch64-unknown-linux-gnu
          --glibc-version=2.17

      # ─── Lite variant (--no-default-features) ─────────────────────────────
      # 创建干净的临时 manifest 目录,只包含 Cargo.toml + src/ + cargokit.yaml(lite版)。
      #
      # 关键设计:CI 和用户本地 Gradle/podspec 创建的目录文件集合完全相同
      # (仅 Cargo.toml + src/ + cargokit.yaml),因此 cargokit 计算的 crate-hash 一致。
      # 用户只需 import 'package:ffuzzy/lite.dart',Gradle 自动扫描到该 import,
      # 指向 lite manifest 目录,cargokit 自动从 precompiled_lite_<hash> Release 下载。
      # 无需任何构建参数。

      # 在仓库根目录创建临时 manifest 目录(相对路径,全平台通用,无需处理 Windows/Unix 路径差异)。
      # cargokit/build_tool 的 working-directory 下 ../../ffuzzy_lite_manifest 即为仓库根下该目录。
      - name: Create lite manifest dir
        if: ${{ inputs.build_lite }}
        shell: bash
        run: |
          mkdir -p ffuzzy_lite_manifest/src
          cp rust/Cargo.toml ffuzzy_lite_manifest/
          cp -r rust/src/. ffuzzy_lite_manifest/src/
          cp rust/cargokit_lite.yaml ffuzzy_lite_manifest/cargokit.yaml
          echo "Lite manifest contents:"
          find ffuzzy_lite_manifest -type f | sort

      - name: Precompile lite (desktop + iOS)
        if: ${{ inputs.build_lite && matrix.kind == 'desktop' }}
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTFLAGS: "-Zunstable-options -Cpanic=immediate-abort"
        run: >
          dart run build_tool precompile-binaries -v
          --manifest-dir=../../ffuzzy_lite_manifest
          --repository=icodejoo/ffuzzy

      - name: Precompile lite (linux-x64 + Android)
        if: ${{ inputs.build_lite && matrix.kind == 'android' }}
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTFLAGS: "-Zunstable-options -Cpanic=immediate-abort"
        run: >
          dart run build_tool precompile-binaries -v
          --manifest-dir=../../ffuzzy_lite_manifest
          --repository=icodejoo/ffuzzy
          --android-sdk-location=$ANDROID_SDK_ROOT
          --android-ndk-version=28.2.13676358
          --android-min-sdk-version=21

      - name: Precompile lite (linux arm64, cross)
        if: ${{ inputs.build_lite && matrix.kind == 'cross-linux' }}
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 用 target-specific 变量而非 RUSTFLAGS，避免污染 cargo install cargo-zigbuild
          # (cargo install 编译宿主工具时宿主 core 是 unwind 策略，immediate-abort 会冲突)
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Zunstable-options -Cpanic=immediate-abort"
        run: >
          dart run build_tool precompile-binaries -v
          --manifest-dir=../../ffuzzy_lite_manifest
          --repository=icodejoo/ffuzzy
          --target=aarch64-unknown-linux-gnu
          --glibc-version=2.17
