name: Web Build (WASM)

# 手动触发:在 Linux 上把 Rust 编成 wasm + 生成 web glue,并构建 example 的 web 产物。
# 为什么放 CI / 必须 Linux:flutter_rust_bridge_codegen 的 build-web 会以子进程方式调用
# `flutter`/`dart`,而 Windows 上它们是 .bat(Rust 进程不解析 .bat → "program not found");
# Linux 上 flutter/dart 是无扩展可执行文件,没有这个问题。
#
# 注意:ffuzzy 的 web 仅作"可用"支持,不建议生产使用——wasm 体积较大(见 README)。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4   # Dart >= 3.12.2(满足 example 的 sdk 约束)

      - name: Setup Rust (+ wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: web-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install frb codegen + wasm-pack
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
          cargo install wasm-pack --locked

      - name: pub get
        run: flutter pub get

      - name: Sanity — cargo build wasm
        working-directory: rust
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Build web (wasm + JS glue)
        run: flutter_rust_bridge_codegen build-web

      - name: Build example web app
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffuzzy-web-example
          path: example/build/web
          if-no-files-found: warn
